server.port=10000
server.servlet.contextPath=/api/v1

spring.queries.users-query=select login, password, 1 from users where login=?
spring.queries.roles-query=select login, role from users where login=?

spring.web.resources.cache.cachecontrol.max-age=0
spring.main.allow-circular-references=true
server.error.include-message=always

# Game settings
bullet.velocity=15
app.assets.models.location=src/main/resources/static/assets/models
app.map.location=src/main/resources/static/map
app.score.max-kept=10

# Database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/tank_deluxe
spring.datasource.username=spring
spring.datasource.password=spring

#spring.datasource.url=jdbc:mysql://localhost:3306/tank_deluxe?serverTimezone=UTC

logging.file=/tmp/tank-deluxe.log